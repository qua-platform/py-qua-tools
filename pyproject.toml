[tool.poetry]
name = "qualang-tools"
version = "v0.23.0"
description = "The qualang_tools package includes various tools related to QUA programs in Python"
authors = ["Quantum Machines <info@quantum-machines.co>"]
license = "BSD-3-Clause"
packages = [
    { include = "qualang_tools" },
    { include = "qualang_tools/wirer/visualizer/web_template.html", format = "sdist" }
]
include = []
exclude = ["**/tests/**"]
readme = "README.md"
homepage = "https://github.com/qua-platform/py-qua-tools"

[tool.poetry.dependencies]
python = ">=3.9, <3.15"
matplotlib = [
    { version = ">=3.10.5", python = ">=3.10" },
    { version = "^3.8.0", python = "<3.10" },
]
pillow = [
    { version = ">=12.0.0", python = ">=3.14" },
    { version = ">=11.1.0,<12", python = "<3.14" },
]
contourpy = [
    { version = ">=1.3.3", python = ">=3.14" },
    { version = ">=1.3.0,<1.3.1", python = "<3.14" },
]
kiwisolver = [
    { version = ">=1.4.9", python = ">=3.14" },
    { version = ">=1.4.7,<1.4.8", python = "<3.14" },
]
numpy = "<3"
qm-qua = ">=1.2.3"
scikit-learn = [
    { version = ">=1.7.2", python = ">=3.10" },
    { version = ">=1.5.0", python = "<3.10" },
]
grpclib = "0.4.5"
grpcio = ">=1.75.1"
attrs = ">=22.2.0"
packaging = ">=20.0"

# Scipy
scipy = [
    { version = ">=1.16.1", python = ">=3.14" },
    { version = ">=1.15.0", python = ">=3.13,<3.14" },
    { version = ">=1.11.0", python = ">=3.9,<3.13" },
]

# interplot
dill = { version = "^0.3.4", optional = true }
pypiwin32 = { version = "^223", optional = true, markers = "sys_platform == 'win32'" }
ipython = { version = "^8.10.0", optional = true }

# configbuilder
pandas = { version = ">=2.3.3", optional = true }
dash = { version = "^2.0.0", optional = true }
dash-html-components = { version = "^2.0.0", optional = true }
dash-core-components = { version = "^2.0.0", optional = true }
dash-bootstrap-components = { version = "^1.6.0", optional = true}
dash-cytoscape = { version = "^0.3.0", optional = true }
dash-table = { version = "^5.0.0", optional = true }
dash-dangerously-set-inner-html = { version = "^0.0.2", optional = true }
docutils = { version = ">=0.14.0 <= 0.21", optional = true }
waitress = { version = "^3.0.1", optional = true }
markupsafe = { version = ">=3.0.3", optional = true }

# datahandler
xarray = ">=2023.0.0,<2025.0.0"
netCDF4 = [
    { version = ">=1.7.4", python = ">=3.11", optional = true },
    { version = "^1.7.2", python = "<3.11", optional = true },
]
cftime = [
    { version = ">=1.6.5", python = ">=3.14", optional = true },
    { version = ">=1.6.4,<1.6.5", python = "<3.14", optional = true },
]

# two-qubit-rb
cirq = [
    { version = "1.6.0", python = ">=3.11" },
    { version = "1.5.0", python = ">=3.10,<3.11" }
]
tqdm = { version = "^4.67.1", optional = true  }
typedunits = { version = ">=0.0.2", python = ">=3.10", optional = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
black = "^24.3"
poethepoet = "^0.18.0"
flake8 = "^7.3.0"
setuptools = "^69.0.2"
qm-saas = "^1.1.7"

[tool.poetry.extras]
interplot = ["dill", "pypiwin32", "ipython"]
configbuilder = [
    "pandas",
    "dash",
    "dash-html-components",
    "dash-core-components",
    "dash-bootstrap-components",
    "dash-cytoscape",
    "dash-table",
    "dash-dangerously-set-inner-html",
    "docutils",
    "waitress",
    "markupsafe",
]
datahandler = ["netcdf4", "cftime"]
two-qubit-rb = ["cirq", "tqdm", "typedunits"]

[tool.black]
line-length = 120
exclude = "qualang_tools/bakery/randomized_benchmark_c1.py"

[tool.poe.tasks]
format = "black qualang_tools"
check-format = "black --check qualang_tools"
lint = "flake8 qualang_tools"
test = "pytest tests"
test_server = "pytest tests_against_server"

[tool.poe.tasks.check]
sequence = ["check-format", "lint", "test"]
help = "Perform all check possible on the code"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
