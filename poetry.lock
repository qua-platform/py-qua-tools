enabler = ["pytest-enabler (>=2.2)"]
test = ["big-O", "importlib-resources ; python_version < \"3.9\"", "jaraco.functools", "jaraco.itertools", "jaraco.test", "more-itertools", "pytest (>=6,!=8.1.*)", "pytest-ignore-flaky"]
type = ["pytest-mypy"]

[extras]
configbuilder = ["dash", "dash-bootstrap-components", "dash-core-components", "dash-cytoscape", "dash-dangerously-set-inner-html", "dash-html-components", "dash-table", "docutils", "markupsafe", "pandas", "waitress"]
datahandler = ["cftime", "cftime", "netCDF4", "netCDF4"]
interplot = ["dill", "ipython", "pypiwin32"]
two-qubit-rb = ["cirq", "cirq", "tqdm", "typedunits"]

[metadata]
lock-version = "2.1"
python-versions = ">=3.9, <3.15"
